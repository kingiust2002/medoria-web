name: Bootstrap secure runtime dependencies

on:
  pull_request:
    branches:
      - infra/self-hosting
    paths:
      - .github/workflows/dependency-security-bootstrap.yml

permissions:
  contents: write

jobs:
  update-manifests:
    if: github.head_ref == 'upgrade/next15-self-hosting'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/next15-self-hosting

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Replace vulnerable direct dependencies
        run: |
          npm uninstall exceljs
          npm install --save-exact fflate@0.8.3 sharp@0.35.3
          npm install --save-dev --save-exact postcss@8.5.18
          npm pkg set overrides.postcss=8.5.18
          npm install

      - name: Verify direct dependency state
        run: |
          node - <<'NODE'
          const p = require('./package.json');
          if (p.dependencies.exceljs) throw new Error('exceljs was not removed');
          if (p.dependencies.fflate !== '0.8.3') throw new Error('fflate is not pinned');
          if (p.dependencies.sharp !== '0.35.3') throw new Error('sharp is not pinned');
          if (p.devDependencies.postcss !== '8.5.18') throw new Error('postcss is not pinned');
          if (p.overrides?.postcss !== '8.5.18') throw new Error('postcss override is missing');
          console.log('direct dependency replacement verified');
          NODE
          npm ls exceljs fflate sharp postcss --all

      - name: Commit package manifests only
        shell: bash
        run: |
          git add package.json package-lock.json
          unexpected=$(git diff --cached --name-only | grep -Ev '^(package.json|package-lock.json)$' || true)
          if [[ -n "$unexpected" ]]; then
            echo "unexpected generated paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "dependency manifests already updated"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: replace vulnerable spreadsheet and image dependencies"
          git push origin HEAD:upgrade/next15-self-hosting
