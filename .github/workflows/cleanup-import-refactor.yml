name: Cleanup import schema bootstrap

on:
  pull_request:
    branches:
      - infra/self-hosting
    paths:
      - .github/workflows/cleanup-import-refactor.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'upgrade/next15-self-hosting'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/next15-self-hosting

      - name: Remove one-shot workflows
        shell: bash
        run: |
          git rm \
            .github/workflows/import-columns-refactor.yml \
            .github/workflows/cleanup-import-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove one-shot import schema workflows"
          git push origin HEAD:upgrade/next15-self-hosting
